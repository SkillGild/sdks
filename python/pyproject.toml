[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgild"
version = "0.1.0"
description = "Official Python client for SkillGild, the marketplace for hosted AI agent skills: search the catalog, run hosted skills and drive hybrid tool sessions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SkillGild", email = "support@skillgild.dev" }]
keywords = ["skillgild", "agent skills", "ai agents", "claude skills", "claude code", "codex", "cursor", "mcp", "llm", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["typing_extensions>=4.7; python_version<'3.11'"]

[project.urls]
Homepage = "https://skillgild.dev/?utm_source=pypi&utm_medium=referral&utm_campaign=sdk"
Documentation = "https://skillgild.dev/docs/api?utm_source=pypi&utm_medium=referral&utm_campaign=sdk"
"Skill catalog" = "https://skillgild.dev/skills?utm_source=pypi&utm_medium=referral&utm_campaign=sdk"
Repository = "https://github.com/SkillGild/sdks"
Issues = "https://github.com/SkillGild/sdks/issues"
Changelog = "https://github.com/SkillGild/sdks/blob/main/python/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillgild = ["py.typed"]
